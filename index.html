<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FFD3E4">
  <title>奇妙半糖梦境·扭蛋机</title>
  <link rel="stylesheet" href="style.v4.css">
</head>
<body>
  <div id="app">
    <!-- 主页面 -->
    <div id="main-page" class="page active">
      <!-- 顶部 -->
      <header class="header">
        <div class="header-actions">
          <button id="music-btn" class="music-btn" aria-label="音乐开关">♪</button>
          <button id="warehouse-btn" class="warehouse-btn" aria-label="我的仓库">
            <svg class="warehouse-icon" width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8.5 7.5V6a3.5 3.5 0 0 1 7 0v1.5"/>
              <path d="M7 7.5h10a3 3 0 0 1 3 3V18a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-7.5a3 3 0 0 1 3-3z"/>
              <path d="M9 12.5h6a1.5 1.5 0 0 1 1.5 1.5v2a1.5 1.5 0 0 1-1.5 1.5H9A1.5 1.5 0 0 1 7.5 16v-2a1.5 1.5 0 0 1 1.5-1.5z"/>
            </svg>
            <span id="warehouse-badge" class="badge hidden">0</span>
          </button>
        </div>
      </header>

      <!-- 扭蛋机区域 -->
      <main class="machine-area">
        <div class="machine-wrapper">
          <img id="machine-img" src="assets/machine-min.png" alt="奇妙半糖梦境扭蛋机" class="machine-img">
          <!-- 摇晃时的闪光层 -->
          <div id="sparkle-layer" class="sparkle-layer"></div>
          <!-- 出奖遮罩 -->
          <div id="prize-overlay" class="prize-overlay hidden">
            <div class="prize-stage" id="prize-stage">
              <img id="prize-img" class="prize-3d" src="" alt="奖品">
              <div id="prize-name" class="prize-name"></div>
              <div id="prize-price" class="prize-price"></div>
            </div>
            <button id="claim-btn" class="claim-btn">收 下</button>
          </div>
        </div>
        <button id="gacha-btn" class="gacha-btn">扭一下</button>
      </main>

      <!-- 奖品预览区 -->
      <section class="prize-preview">
        <div class="preview-header">
          <h2 class="section-title">全部奖品</h2>
          <span id="progress-text" class="progress-text">0 / 23</span>
        </div>
        <div class="scroll-hint">← 滑动查看全部 →</div>
        <div id="prize-list" class="prize-list">
          <!-- 奖品缩略图由 JS 动态生成 -->
        </div>
      </section>

      <!-- 免责声明 -->
      <footer class="disclaimer">
        游戏仅供娱乐，您不会获得任何实际奖品
      </footer>
    </div>

    <!-- 仓库页面 -->
    <div id="warehouse-page" class="page">
      <header class="warehouse-header">
        <button id="back-btn" class="back-btn" aria-label="返回">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>
        <h1 class="warehouse-title">我的仓库</h1>
        <span id="warehouse-total" class="warehouse-total"></span>
      </header>
      <main id="warehouse-content" class="warehouse-content">
        <!-- 仓库内容由 JS 动态生成 -->
      </main>
    </div>
  </div>

  <!-- iOS 体感权限按钮（全局，不嵌在页面容器里） -->
  <button id="tilt-permission-btn" class="tilt-permission-btn hidden">👆 开启体感 3D</button>

  <audio id="bgm" loop preload="metadata">
    <source src="assets/bgm.mp3" type="audio/mpeg">
  </audio>

  <script src="app.v4.js"></script>
</body>
</html>
